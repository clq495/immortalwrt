steps:
  - name: 拉取 ImmortalWrt 源码
    uses: actions/checkout@v4
    with:
      repository: laipeng668/immortalwrt
      ref: openwrt-25.12
      submodules: recursive

  - name: 清理系统冗余释放磁盘空间
    run: |
      sudo rm -rf /usr/share/dotnet
      sudo rm -rf /usr/local/lib/android
      sudo rm -rf /opt/ghc
      sudo rm -rf /opt/hostedtoolcache/CodeQL
      sudo apt-get autoremove -y
      sudo apt-get clean

  - name: 安装编译依赖
    run: |
      sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'

  - name: 生成京东云一代专属配置
    run: |
      echo "CONFIG_TARGET_ramips=y" >> .config
      echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
      echo "CONFIG_TARGET_ramips_mt7621_DEVICE_jdcloud_re-sp-01b=y" >> .config
      echo "CONFIG_PACKAGE_luci-app-turboacc=y" >> .config
      echo "CONFIG_PACKAGE_block-mount=y" >> .config
      echo "CONFIG_PACKAGE_kmod-fs-ext4=y" >> .config
      echo "CONFIG_PACKAGE_e2fsprogs=y" >> .config
      echo "CONFIG_PACKAGE_luci-app-commands=y" >> .config
      echo "CONFIG_PACKAGE_apk-tools=y" >> .config
      make defconfig

  - name: 执行固件全量编译
    run: |
      make -j$(nproc)

  - name: 上传编译完成固件
    uses: actions/upload-artifact@v4
    with:
      name: 京东云一代 ImmortalWrt 固件
      path: bin/targets/ramips/mt7621/*.bin
